<style>
:root{--bg:#f7f6f2;--ink:#14263a;--mut:#6b7785;--line:#d9dde2;--card:#fff;--pen:#4a45b5;--tape:#f2c230;--danger:#b3372b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b29;--ink:#eef1f4;--mut:#93a0ae;--line:#26384c;--card:#16263a;--pen:#a9a6ff;--danger:#ff8a7c}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:800;text-align:center;margin:6px 0 4px}
.tape{height:12px;border-radius:3px;margin:0 auto 16px;width:120px;background:repeating-linear-gradient(to left,var(--tape) 0 2px,transparent 2px 10px),linear-gradient(var(--tape),var(--tape)) bottom/100% 5px no-repeat}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label,.lab{display:block;font-size:15px;font-weight:700;margin:0 0 4px}
input{font:inherit;width:100%;padding:11px;border:2px solid var(--pen);border-radius:4px;background:var(--card);color:var(--ink)}
select{font:inherit;width:100%;padding:11px;border:2px solid var(--pen);border-radius:4px;background:var(--card);color:var(--ink)}
select:focus,input:focus,button:focus-visible,.photo:focus-within{outline:3px solid var(--tape);outline-offset:1px}
.door{margin-top:20px;padding-top:14px;border-top:2px dashed var(--line)}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.num{width:34px;height:34px;border:2px solid var(--pen);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--pen)}
.dh strong{font-size:20px}
.photo{font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--pen);border-radius:4px;color:var(--pen);cursor:pointer}
.photo input{display:none}
.rm{margin-inline-start:auto;font:inherit;font-weight:700;border:0;background:none;color:var(--danger);padding:6px 0}
.thumb{display:block;max-width:100%;max-height:200px;border-radius:6px;margin:0 0 10px;border:1px solid var(--line)}
.f{margin-bottom:10px}
.add{width:100%;font:inherit;font-weight:800;font-size:17px;padding:14px;border:2px solid var(--pen);border-radius:4px;background:none;color:var(--pen);margin-top:16px}
.tot{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr 1fr;text-align:center}
.tot span{display:block;font-size:13px;opacity:.75}
.tot b{font-size:22px;direction:ltr;display:inline-block}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.act button{font:inherit;font-weight:700;padding:12px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.msg{text-align:center;color:var(--mut);font-size:14px;min-height:22px;margin-top:6px}
.rep{display:none}
#ttl{font-size:22px;font-weight:800;text-align:center;margin:6px 0 4px}
.lsvg{display:block;width:100%;max-width:420px;margin:0 auto 10px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bar button{font:inherit;font-weight:800;padding:12px;border:2px solid var(--pen);border-radius:4px;background:none;color:var(--pen)}
#jsave{background:var(--pen);color:var(--bg)}
.jobs{margin-bottom:14px;border:2px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--card)}
.jobs summary{font-weight:800;cursor:pointer}
.job{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);margin-top:8px}
.job .jn{flex:1;min-width:0}
.job .jn b{display:block}
.job .jn span{display:block;color:var(--mut);font-size:13px}
.job button{font:inherit;font-weight:700;padding:6px 12px;border:2px solid var(--pen);border-radius:4px;background:none;color:var(--pen)}
.job button.del{border-color:var(--danger);color:var(--danger)}
.jempty{color:var(--mut);padding:10px 0 2px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{font:inherit;font-weight:700;padding:8px 14px;border:2px solid var(--pen);border-radius:4px;background:none;color:var(--pen)}
.opts button[aria-pressed="true"]{background:var(--pen);color:var(--bg)}
.rep h2{font-size:22px;margin:0 0 8px;text-align:center}
.rep h3{font-size:18px;margin:18px 0 6px}
.rep table{width:100%;border-collapse:collapse;margin-bottom:6px}
.rep th,.rep td{border:1px solid #333;padding:6px 8px;text-align:right}
.rep p{margin:2px 0}
@page{margin:14mm}
@media print{body{background:#fff!important;color:#000!important}.wrap>*:not(.rep){display:none!important}.rep{display:block;color:#000}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.tabs button{font:inherit;font-weight:800;font-size:14px;line-height:1.25;padding:10px 2px;border:2px solid var(--pen);border-radius:4px;background:none;color:var(--pen)}
.tabs button[aria-pressed="true"]{background:var(--pen);color:var(--bg)}
.pamt{display:block;font-size:14px;color:var(--mut);margin-top:3px;min-height:20px}
.sum{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.sum h3{margin:0 0 6px;font-size:17px}
.sr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.sr b{direction:ltr}
.sr.t{font-size:19px;font-weight:800;border-top:2px solid var(--ink)}
@media (min-width:800px){.wrap{max-width:760px;padding:32px 24px}}
</style>
</head>
<body>
<div class="wrap">

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button type="button" id="xexp" style="font:inherit;font-weight:800;padding:10px 16px;border:2px solid var(--pen);border-radius:4px;background:var(--card);color:var(--pen);cursor:pointer;display:inline-block">تصدير الزبائن</button><label for="ximf" style="font:inherit;font-weight:800;padding:10px 16px;border:2px solid var(--pen);border-radius:4px;background:var(--card);color:var(--pen);cursor:pointer;display:inline-block">استيراد الزبائن</label><input type="file" id="ximf" style="display:none"></div>
<div id="xstat" style="margin-top:8px;font-size:14px"></div>
</details>
<details class="jobs" id="jd"><summary id="jsum">الزبائن المحفوظون (0)</summary><div id="jl"></div></details>

<div class="grid">
  <div class="f"><label for="cn">اسم الزبون</label><input id="cn"></div>
  <div class="f"><label for="ca">العنوان</label><input id="ca"></div>
  <div class="f"><label for="cp">رقم الهاتف</label><input id="cp" type="tel" inputmode="tel" dir="ltr" style="text-align:right"></div>
  <div class="f"><label for="cd">موعد التركيب</label><input id="cd" type="date"></div>
</div>

<div id="doors"></div>
<button type="button" class="add" id="add">إضافة باب</button>

<div class="tot" id="tt">
  <div><span id="tl">عدد الأبواب</span><b id="tc">0</b></div>
  <div id="ar"><span>المساحة م²</span><b id="ta">0</b></div>
  <div id="am"><span>المبلغ</span><b id="tm">$0</b></div>
</div>
<div class="sum" id="sum"></div>
<div class="act">
  <button type="button" id="copy">نسخ الملخص</button>
  <button type="button" id="pdf">تصدير PDF</button>
  <button type="button" id="clear">مسح الكل</button>
</div>
<div class="msg" id="msg" role="status"></div>
<div id="rep" class="rep"></div>
</div>

    var blob=buildPdf(await drawReport());
    if(dl){await dl.save({filename:"measurements.pdf",data:blob})}else{await saveBlob(blob)}
    $("msg").textContent="تم تجهيز الملف";
  }catch(e){$("msg").textContent=(e&&e.code==="declined")?"تم إلغاء الحفظ.":"تعذر إنشاء الملف، حاول مرة أخرى."}
};
var JK="dijla-jobs",jobs=[];
try{jobs=JSON.parse(localStorage.getItem(JK)||"[]")||[]}catch(e){jobs=[]}
function saveJobs(){try{localStorage.setItem(JK,JSON.stringify(jobs))}catch(e){$("msg").textContent="تعذر حفظ الزبائن على هذا الجهاز."}}
function uid(){return "j"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
if(!data.id){data.id=uid();save()}
function fixData(){var b=blank();if(!data.c)data.c=b.c;if(!data.prices)data.prices={};["doors","windows","slide","vents","counters","mahjalat"].forEach(function(k){if(!data[k]||!data[k].length)data[k]=b[k]})}
function loadInputs(){Object.keys(cmap).forEach(function(id){$(id).value=data.c[cmap[id]]||""})}
function dirty(){var b=blank(),pick=function(x){return JSON.stringify({pr:Object.keys(x.prices||{}).filter(function(k){return String(x.prices[k]||"")}).sort().map(function(k){return k+":"+x.prices[k]}),c:x.c,doors:x.doors,windows:x.windows,slide:x.slide,vents:x.vents,counters:x.counters,mahjalat:x.mahjalat})};return pick(data)!==pick(b)}
function storeCurrent(){
  var n=(data.c.n||"").trim();if(!n)return false;
  var rec={id:data.id,name:n,at:Date.now(),d:JSON.parse(JSON.stringify(data))},i=jobs.findIndex(function(j){return j.id===data.id});
  if(i>=0)jobs[i]=rec;else jobs.unshift(rec);
  saveJobs();renderJobs();return true;
}
function renderJobs(){
  var L=$("jl");L.innerHTML="";$("jsum").textContent="الزبائن المحفوظون ("+jobs.length+")";
  if(!jobs.length){L.appendChild(mk("div","jempty","لا يوجد زبائن محفوظون بعد."));return}
  jobs.forEach(function(j){
    var r=mk("div","job"),n=mk("div","jn"),dt=new Date(j.at);
    n.appendChild(mk("b",null,j.name));
    n.appendChild(mk("span",null,(j.d.c&&j.d.c.p?j.d.c.p+" | ":"")+"آخر حفظ: "+dt.getFullYear()+"/"+(dt.getMonth()+1)+"/"+dt.getDate()));
    var o=mk("button",null,"فتح");o.type="button";o.onclick=function(){openJob(j.id)};
    var x=mk("button","del","حذف");x.type="button";
    x.onclick=function(){
      if(x.dataset.arm){jobs=jobs.filter(function(k){return k.id!==j.id});saveJobs();renderJobs();$("msg").textContent="تم حذف الزبون من المحفوظات"}
      else{x.dataset.arm="1";x.textContent="تأكيد؟";setTimeout(function(){delete x.dataset.arm;x.textContent="حذف"},4000)}
    };
    r.appendChild(n);r.appendChild(o);r.appendChild(x);L.appendChild(r);
  });
}
function openJob(id){
  var j=jobs.find(function(k){return k.id===id});if(!j)return;
  if(id===data.id){$("msg").textContent="هذا الزبون مفتوح الآن.";return}
  if(!storeCurrent()&&dirty()){$("msg").textContent="اكتب اسم الزبون الحالي لحفظ بياناته قبل فتح زبون آخر.";return}
  data=JSON.parse(JSON.stringify(j.d));data.id=j.id;fixData();save();loadInputs();render();
  $("msg").textContent="تم فتح "+j.name+". عدّل ثم اضغط حفظ للزبون.";
  try{window.scrollTo(0,0)}catch(e){}
}
$("jsave").onclick=function(){
  if(storeCurrent())$("msg").textContent="تم حفظ نسخة الزبون: "+data.c.n;
  else $("msg").textContent="اكتب اسم الزبون أولاً ثم احفظ.";
};
$("jnew").onclick=function(){
  var saved=storeCurrent();
  if(!saved&&dirty()){$("msg").textContent="اكتب اسم الزبون الحالي لحفظ بياناته، أو اضغط مسح الكل.";return}
  data=blank();data.id=uid();save();loadInputs();render();
  $("msg").textContent=saved?"تم حفظ الزبون السابق وفتح زبون جديد.":"زبون جديد.";
  try{window.scrollTo(0,0)}catch(e){}
};
renderJobs();
$("copy").onclick=function(){
  var t="القياسات\nالزبون: "+(data.c.n||"-")+"\nالعنوان: "+(data.c.a||"-")+"\nالهاتف: "+(data.c.p||"-")+"\nموعد التركيب: "+(data.c.d||"-")+"\n";
  ["doors","windows","slide","vents"].forEach(function(k){(data[k]||[]).forEach(function(d,i){t+="\n"+K[k].s+" "+(d.loc||(i+1))+": عرض "+(d.w||"-")+" × ارتفاع "+(d.h||"-")+(d.dir?" | الاتجاه: "+d.dir:"")+(d.col?" | اللون: "+d.col:"")+(d.thr?" | العثرة: "+d.thr:"")+(d.mv?" | النوع: "+d.mv:"")+(d.mat?" | نوع الشباك: "+d.mat:"")+(d.typ?" | النوع: "+d.typ:"")+(d.glz?" | الزجاج: "+d.glz:"")+(d.vm?" | المادة: "+d.vm:"")+(d.cool?" | المبردة: "+d.cool:"")+(d.note?" | "+d.note:"")})});(data.mahjalat||[]).forEach(function(d,i){if(mjUsed(d))t+="\nمحجل "+(i+1)+": "+mjLines(d).join(" | ")+(d.note?" | "+d.note:"")});data.counters.forEach(function(d,i){t+="\nكاونتر "+(i+1)+": "+(d.s||[]).map(function(v,j){return (j+1)+"="+(v||"-")}).join("، ")+(d.note?" | "+d.note:"")});
  t+="\n\n"+K[kind].cnt+": "+$("tc").textContent+((kind!=="doors"&&kind!=="counters"&&kind!=="mahjalat")?" | المساحة: "+$("ta").textContent+" م²":"");
  try{navigator.clipboard.writeText(t).then(function(){$("msg").textContent="تم نسخ الملخص"},function(){$("msg").textContent="تعذر النسخ، حاول مرة أخرى."})}
  catch(e){$("msg").textContent="تعذر النسخ، حاول مرة أخرى."}
};
$("clear").onclick=function(){
  var b=$("clear");if(!b.dataset.arm){b.dataset.arm="1";b.textContent="اضغط للتأكيد";$("msg").textContent="اضغط مرة ثانية لمسح كل البيانات.";setTimeout(function(){delete b.dataset.arm;b.textContent="مسح الكل"},4000);return}delete b.dataset.arm;b.textContent="مسح الكل";{
    data=blank();data.id=uid();save();
    Object.keys(cmap).forEach(function(id){$(id).value=""});render();$("msg").textContent="تم المسح"}
};
render();
})();

function jstamp(){var d=new Date();return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)}
$("xexp").onclick=function(){
  if(!jobs.length){$("xstat").textContent="لا يوجد زبائن محفوظون لتصديرهم.";return}
  var name="dijla-customers-"+jstamp()+".json";
  var blob=new Blob([JSON.stringify({app:"dijla",v:1,jobs:jobs})],{type:"application/json"});
  var f=null;try{f=new File([blob],name,{type:"application/json"})}catch(e){}
  function fallback(){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000);$("xstat").textContent="تم تنزيل الملف: "+name}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"زبائن دجلة"}).then(function(){$("xstat").textContent="تم التصدير."}).catch(function(e){if(!e||e.name!=="AbortError")fallback()})}else fallback();
};
$("ximf").onchange=function(){
  var fl=this.files&&this.files[0];if(!fl)return;var inp=this;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result),list=o&&o.jobs;if(!Array.isArray(list))throw 0;
      var add=0,upd=0;
      list.forEach(function(r){
        if(!r||!r.id||!r.d||!r.name)return;
        var i=jobs.findIndex(function(j){return j.id===r.id});
        if(i<0){jobs.push(r);add++}else if((r.at||0)>(jobs[i].at||0)){jobs[i]=r;upd++}
      });
      jobs.sort(function(a,b){return b.at-a.at});saveJobs();renderJobs();
      $("xstat").textContent="تم الدمج: "+add+" زبون جديد، "+upd+" محدّث.";
    }catch(e){$("xstat").textContent="الملف غير صالح، اختر ملف زبائن دجلة (.json)."}
    inp.value="";
  };
  rd.readAsText(fl);
};

if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
