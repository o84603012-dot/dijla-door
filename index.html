<style>
:root{--bg:#eaf8d6;--ink:#1f3d12;--mut:#587448;--line:#c9e3a6;--card:#fff;--pen:#2e8b1f;--tape:#f5c518;--sel:#f7d43a;--selt:#1f3d12;--danger:#b3372b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:800;text-align:center;margin:6px 0 4px}
.tape{height:12px;border-radius:3px;margin:0 auto 16px;width:120px;background:repeating-linear-gradient(to left,var(--tape) 0 2px,transparent 2px 10px),linear-gradient(var(--tape),var(--tape)) bottom/100% 5px no-repeat}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label,.lab{display:block;font-size:15px;font-weight:700;margin:0 0 4px}
input{font:inherit;width:100%;padding:11px;border:2px solid var(--pen);border-radius:4px;background:var(--card);color:var(--ink)}
select{font:inherit;width:100%;padding:11px;border:2px solid var(--pen);border-radius:4px;background:var(--card);color:var(--ink)}
select:focus,input:focus,button:focus-visible,.photo:focus-within{outline:3px solid var(--tape);outline-offset:1px}
